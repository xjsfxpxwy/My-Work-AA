<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>依赖全检 v3 · 精确映射版</title>
    <style>
        body { margin:0; overflow:hidden; background:#0a0a14; font-family:monospace; }
        #report {
            position: absolute; top:10px; left:10px; right:10px; z-index:20;
            background: rgba(0,0,0,0.85); padding: 15px; border-radius: 10px;
            max-height: 92vh; overflow-y:auto; font-size:13px; line-height:1.5;
            white-space: pre-wrap; word-break: break-word; color:#ccc;
        }
        .ok { color:#2ecc71; }
        .fail { color:#e74c3c; }
        .info { color:#4cc9f0; }
    </style>
</head>
<body>
    <div id="report"></div>

    <!-- 精确映射，一个文件一个入口，彻底避免通配符歧义 -->
    <script type="importmap">
    {
        "imports": {
            "three": "./001.js",
            "three-mesh-bvh": "./002.js",
            "three-bvh-csg": "./003.js",
            "lil-gui": "./004.js",
            "three/addons/controls/OrbitControls.js": "./005.js",
            "three/addons/postprocessing/EffectComposer.js": "./postprocessing/EffectComposer.js",
            "three/addons/postprocessing/RenderPass.js": "./postprocessing/RenderPass.js",
            "three/addons/postprocessing/ShaderPass.js": "./postprocessing/ShaderPass.js",
            "three/addons/postprocessing/Pass.js": "./postprocessing/Pass.js",
            "three/addons/postprocessing/MaskPass.js": "./postprocessing/MaskPass.js",
            "three/addons/shaders/CopyShader.js": "./shaders/CopyShader.js",
            "three/addons/shaders/FXAAShader.js": "./shaders/FXAAShader.js"
        }
    }
    </script>

    <script type="module">
        const report = document.getElementById('report');
        const log = (msg, cls = '') => {
            report.innerHTML += `<span class="${cls}">${msg}</span>\n`;
        };

        // 动态加载测试
        const modules = [
            { id:'001', path:'three', desc:'Three.js 核心' },
            { id:'002', path:'three-mesh-bvh', desc:'MeshBVH' },
            { id:'003', path:'three-bvh-csg', desc:'BVH‑CSG' },
            { id:'004', path:'lil-gui', desc:'lil‑gui' },
            { id:'005', path:'three/addons/controls/OrbitControls.js', desc:'OrbitControls' },
            { id:'006', path:'three/addons/postprocessing/EffectComposer.js', desc:'EffectComposer' },
            { id:'007', path:'three/addons/postprocessing/RenderPass.js', desc:'RenderPass' },
            { id:'008', path:'three/addons/postprocessing/ShaderPass.js', desc:'ShaderPass' },
            { id:'009', path:'three/addons/shaders/CopyShader.js', desc:'CopyShader' },
            { id:'010', path:'three/addons/shaders/FXAAShader.js', desc:'FXAAShader' },
            { id:'011', path:'three/addons/postprocessing/Pass.js', desc:'Pass (含 FullScreenQuad)' },
            { id:'012', path:'three/addons/postprocessing/MaskPass.js', desc:'MaskPass' },
        ];

        log('🔍 开始逐个检查依赖...\n');

        const loaded = {};
        for (const m of modules) {
            try {
                const mod = await import(m.path);
                loaded[m.id] = mod;
                log(`✅ ${m.id} - ${m.desc} 加载成功`, 'ok');
            } catch (err) {
                log(`❌ ${m.id} - ${m.desc} 加载失败`, 'fail');
                log(`   ${err.message || err}`, 'fail');
                // 立即终止，因为后续模块依赖前面
                log('\n⛔ 诊断停止，请修复上方红色错误后再试。');
                return;
            }
        }

        log('\n✨ 全部 12 个依赖加载成功！正在初始化场景…\n', 'info');

        // 提取变量
        const THREE = loaded['001'];
        const MeshBVH = loaded['002'].MeshBVH;
        const { Brush, Evaluator, SUBTRACTION } = loaded['003'];
        const GUI = loaded['004'].default;
        const OrbitControls = loaded['005'].OrbitControls;
        const EffectComposer = loaded['006'].EffectComposer;
        const RenderPass = loaded['007'].RenderPass;
        const ShaderPass = loaded['008'].ShaderPass;
        const FXAAShader = loaded['010'].FXAAShader;

        // ---- 场景 ----
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0d0d1a);
        const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 1000);
        camera.position.set(4, 2.5, 5);
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
        renderer.setSize(innerWidth, innerHeight);
        renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 0, 0);
        controls.enableDamping = true;
        controls.update();

        scene.add(new THREE.AmbientLight(0x404060, 0.5));
        const hemi = new THREE.HemisphereLight(0x87ceeb, 0x362d59, 0.8);
        scene.add(hemi);
        const mainLight = new THREE.DirectionalLight(0xffeedd, 2.2);
        mainLight.position.set(3, 6, 4);
        mainLight.castShadow = true;
        mainLight.shadow.mapSize.set(1024, 1024);
        scene.add(mainLight);

        // 布尔运算物体
        const boxGeo = new THREE.BoxGeometry(1.6, 1.6, 1.6);
        const sphereGeo = new THREE.SphereGeometry(0.95, 48, 48);
        boxGeo.boundsTree = new MeshBVH(boxGeo);
        sphereGeo.boundsTree = new MeshBVH(sphereGeo);
        const boxBrush = new Brush(boxGeo);
        const sphereBrush = new Brush(sphereGeo);
        sphereBrush.position.set(0.75, 0.75, 0.75);
        sphereBrush.updateMatrixWorld();
        const evaluator = new Evaluator();
        let result = evaluator.evaluate(boxBrush, sphereBrush, SUBTRACTION);
        result.material = new THREE.MeshStandardMaterial({ color: '#4cc9f0', roughness: 0.35, metalness: 0.15 });
        scene.add(result);

        // 后处理
        let composer;
        try {
            composer = new EffectComposer(renderer);
            const renderPass = new RenderPass(scene, camera);
            composer.addPass(renderPass);
            const fxaaPass = new ShaderPass(FXAAShader);
            const pr = renderer.getPixelRatio();
            fxaaPass.uniforms['resolution'].value.set(1 / (innerWidth * pr), 1 / (innerHeight * pr));
            fxaaPass.renderToScreen = true;
            composer.addPass(fxaaPass);
            log('✨ 后处理 (FXAA) 已激活', 'ok');
        } catch (e) {
            log('⚠️ 后处理未启用: ' + e.message, 'info');
        }

        // GUI
        const settings = { speed: 0.006 };
        const gui = new GUI({ title: '控制', width: 280 });
        gui.add(settings, 'speed', 0, 0.03).name('旋转速度');
        gui.add({ info: '全部依赖正常' }, 'info').name('状态').disable();

        // 动画
        function animate() {
            requestAnimationFrame(animate);
            result.rotation.y += settings.speed;
            controls.update();
            if (composer) composer.render();
            else renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = innerWidth / innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(innerWidth, innerHeight);
            if (composer) composer.setSize(innerWidth, innerHeight);
        });

        log('🚀 场景运行中，请查看左上角面板。', 'info');
    </script>
</body>
</html>
