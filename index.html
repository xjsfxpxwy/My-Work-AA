<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试 three-mesh-bvh (002.js)</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            pointer-events: none;
            z-index: 10;
            max-width: 90%;
        }
    </style>
</head>
<body>
    <div id="info">正在加载 Three.js + three-mesh-bvh...</div>

    <!-- 导入映射：001.js = Three.js，002.js = three-mesh-bvh -->
    <script type="importmap">
    {
        "imports": {
            "three": "./001.js",
            "three-mesh-bvh": "./002.js"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { MeshBVH, MeshBVHHelper } from 'three-mesh-bvh';

        const infoDiv = document.getElementById('info');

        try {
            // 检查 Three.js 版本
            infoDiv.innerHTML = `Three.js 版本: ${THREE.REVISION}<br>正在测试 MeshBVH...`;

            // 验证 MeshBVH 是否存在
            if (typeof MeshBVH !== 'function') {
                throw new Error('MeshBVH 未正确导出（不是函数）');
            }

            // 创建测试场景
            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x111122);

            const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(3, 2, 5);
            camera.lookAt(0, 0, 0);

            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // 创建一个几何体，为其构建 BVH
            const geometry = new THREE.TorusKnotGeometry(1, 0.3, 100, 16);
            const material = new THREE.MeshStandardMaterial({ color: 0x4cc9f0, roughness: 0.4 });
            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.set(0, 0.5, 0);
            scene.add(mesh);

            // 为几何体构建 BVH
            geometry.computeBoundsTree = MeshBVH.computeBoundsTree; // 添加构建方法
            geometry.computeBoundsTree(); // 构建 BVH

            // 验证 BVH 是否构建成功
            if (!geometry.boundsTree) {
                throw new Error('BVH 构建失败');
            }

            // 可选：添加 BVH 可视化帮助器（MeshBVHHelper）
            let bvhHelper = null;
            if (typeof MeshBVHHelper === 'function') {
                bvhHelper = new MeshBVHHelper(mesh, 3); // 3 是 BVH 深度显示等级
                if (bvhHelper) {
                    // helper 默认可能可见，可根据需要调整
                    // scene.add(bvhHelper);
                    // 如果 helper 导致视觉杂乱，可以先不加，仅测试存在
                }
            }

            // 光照
            scene.add(new THREE.AmbientLight(0x404040, 0.6));
            const dirLight = new THREE.DirectionalLight(0xffffff, 1);
            dirLight.position.set(1, 2, 1);
            scene.add(dirLight);

            // 网格地面参考
            const gridHelper = new THREE.GridHelper(4, 20, 0x888888, 0x444444);
            scene.add(gridHelper);

            // 动画
            function animate() {
                requestAnimationFrame(animate);
                mesh.rotation.y += 0.005;
                renderer.render(scene, camera);
            }
            animate();

            // 窗口大小调整
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            // 更新信息
            infoDiv.innerHTML = `Three.js 版本: ${THREE.REVISION}<br>✅ MeshBVH 加载成功，BVH 已构建<br>观察 TorusKnot 模型旋转`;

            console.log('✅ three-mesh-bvh 测试通过！', MeshBVH);

        } catch (error) {
            infoDiv.innerHTML = `❌ 测试失败:<br>${error.message}`;
            infoDiv.style.background = 'rgba(200,0,0,0.8)';
            console.error('❌ 测试失败:', error);
        }
    </script>
</body>
</html>
