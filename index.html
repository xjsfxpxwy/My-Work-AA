<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试 three.module.js</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div id="info">正在加载 Three.js...</div>

    <!-- 导入映射：只映射 three 到本地 001.js -->
    <script type="importmap">
    {
        "imports": {
            "three": "./001.js"
        }
    }
    </script>

    <!-- 测试脚本 -->
    <script type="module">
        import * as THREE from 'three';

        const infoDiv = document.getElementById('info');

        try {
            // 检查是否成功导入
            infoDiv.textContent = `Three.js 版本: ${THREE.REVISION} ✅`;

            // 创建场景、相机、渲染器
            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x111122);

            const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 5;

            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // 添加一个彩色立方体
            const geometry = new THREE.BoxGeometry(2, 2, 2);
            const material = new THREE.MeshStandardMaterial({ color: 0x4cc9f0, roughness: 0.3, metalness: 0.1 });
            const cube = new THREE.Mesh(geometry, material);
            scene.add(cube);

            // 灯光
            const ambientLight = new THREE.AmbientLight(0x404040, 0.5);
            scene.add(ambientLight);
            const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
            directionalLight.position.set(1, 1, 1);
            scene.add(directionalLight);

            // 动画循环
            function animate() {
                requestAnimationFrame(animate);
                cube.rotation.x += 0.01;
                cube.rotation.y += 0.01;
                renderer.render(scene, camera);
            }
            animate();

            // 窗口大小自适应
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            console.log('✅ three.module.js 测试通过！');
        } catch (error) {
            infoDiv.textContent = `❌ 加载失败: ${error.message}`;
            infoDiv.style.background = 'rgba(200,0,0,0.8)';
            console.error('❌ three.module.js 测试失败:', error);
        }
    </script>
</body>
</html>
