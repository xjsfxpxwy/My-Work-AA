<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>测试 003.js (three-bvh-csg)</title>
    <style>
        body { background: #111; color: #fff; font-family: monospace; padding: 20px; }
        pre { background: #222; padding: 15px; border-radius: 5px; }
    </style>
</head>
<body>
    <h2>003.js 加载测试</h2>
    <pre id="log">等待导入...</pre>

    <!-- 必须提供三个依赖的映射 -->
    <script type="importmap">
    {
        "imports": {
            "three": "./001.js",
            "three-mesh-bvh": "./002.js",
            "three-bvh-csg": "./003.js"
        }
    }
    </script>

    <script type="module">
        const log = document.getElementById('log');
        function add(msg) {
            log.textContent += msg + '\n';
            console.log(msg);
        }

        add('开始测试...');
        try {
            add('导入 three-bvh-csg...');
            const csgModule = await import('three-bvh-csg');
            add('✅ 导入成功！模块导出: ' + Object.keys(csgModule).join(', '));

            if (csgModule.CSG) {
                add('✅ CSG 对象存在');
                add('CSG.subtract 类型: ' + typeof csgModule.CSG.subtract);
                add('CSG.union 类型: ' + typeof csgModule.CSG.union);
            } else {
                add('❌ CSG 未导出，实际导出: ' + JSON.stringify(csgModule));
            }
        } catch (err) {
            add('❌ 错误: ' + err.message);
            console.error(err);
        }
    </script>
</body>
</html>
