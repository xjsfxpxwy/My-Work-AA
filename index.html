<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试 three-mesh-bvh (002.js)</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            pointer-events: none;
            z-index: 10;
            max-width: 90%;
        }
    </style>
</head>
<body>
    <div id="info">正在加载 Three.js + three-mesh-bvh...</div>

    <!-- 导入映射 -->
    <script type="importmap">
    {
        "imports": {
            "three": "./001.js",
            "three-mesh-bvh": "./002.js"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { MeshBVH, MeshBVHHelper } from 'three-mesh-bvh';

        const infoDiv = document.getElementById('info');

        try {
            infoDiv.innerHTML = `Three.js 版本: ${THREE.REVISION}<br>正在测试 MeshBVH...`;

            // 调试输出 MeshBVH 的结构
            console.log('MeshBVH 导出内容:', MeshBVH);
            console.log('MeshBVH.build 方法:', MeshBVH.build);

            // 检查 MeshBVH 是否有效
            if (!MeshBVH || typeof MeshBVH !== 'object') {
                throw new Error('MeshBVH 未正确导出（不是对象）');
            }
            if (typeof MeshBVH.build !== 'function') {
                throw new Error('MeshBVH.build 方法不存在，请检查 002.js 内容');
            }

            // 创建场景
            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x111122);

            const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(3, 2, 5);
            camera.lookAt(0, 0, 0);

            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // 创建几何体
            const geometry = new THREE.TorusKnotGeometry(1, 0.3, 100, 16);
            const material = new THREE.MeshStandardMaterial({ color: 0x4cc9f0, roughness: 0.4 });
            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.set(0, 0.5, 0);
            scene.add(mesh);

            // 使用 MeshBVH.build 构建 BVH
            MeshBVH.build(geometry);

            // 验证 BVH 是否构建成功
            if (!geometry.boundsTree) {
                throw new Error('BVH 构建后未生成 boundsTree');
            }

            // 光照
            scene.add(new THREE.AmbientLight(0x404040, 0.6));
            const dirLight = new THREE.DirectionalLight(0xffffff, 1);
            dirLight.position.set(1, 2, 1);
            scene.add(dirLight);

            const gridHelper = new THREE.GridHelper(4, 20, 0x888888, 0x444444);
            scene.add(gridHelper);

            // 动画循环
            function animate() {
                requestAnimationFrame(animate);
                mesh.rotation.y += 0.005;
                renderer.render(scene, camera);
            }
            animate();

            // 窗口大小自适应
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            infoDiv.innerHTML = `Three.js 版本: ${THREE.REVISION}<br>✅ MeshBVH 加载成功，BVH 已构建`;
            console.log('✅ three-mesh-bvh 测试通过！');

        } catch (error) {
            infoDiv.innerHTML = `❌ 测试失败:<br>${error.message}`;
            infoDiv.style.background = 'rgba(200,0,0,0.8)';
            console.error('❌ 测试失败:', error);
        }
    </script>
</body>
</html>
