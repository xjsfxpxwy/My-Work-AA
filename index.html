<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>单独测试 006 EffectComposer</title>
</head>
<body>
    <pre id="log"></pre>

    <script type="importmap">
    {
        "imports": {
            "three": "./001.js",
            "three/addons/": "./"
        }
    }
    </script>

    <script type="module">
        const log = document.getElementById('log');
        const print = (msg, color = 'white') => {
            log.innerHTML += `<span style="color:${color}">${msg}</span>\n`;
        };

        print('🔍 测试 001.js + 006.js (EffectComposer)\n');

        try {
            print('⏳ 加载 Three.js...');
            const three = await import('three');
            print('✅ Three.js 加载成功，版本 ' + three.REVISION, 'lime');

            print('⏳ 加载 EffectComposer...');
            const ec = await import('three/addons/postprocessing/EffectComposer.js');
            print('✅ EffectComposer 加载成功', 'lime');
            print('EffectComposer 导出: ' + Object.keys(ec).join(', '));
        } catch (err) {
            print('❌ 失败: ' + err.message, 'red');
            console.error(err);
        }
    </script>
</body>
</html>
