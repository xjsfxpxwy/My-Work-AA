<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>本地 003 测试</title>
    <style>
        body { margin: 0; overflow: hidden; }
        #info {
            position: absolute; top: 20px; left: 20px;
            background: rgba(0,0,0,0.7); color: white;
            padding: 10px; border-radius: 5px; z-index: 10;
        }
    </style>
</head>
<body>
    <div id="info">加载中...</div>
    <script type="importmap">
    {
        "imports": {
            "three": "./001.js",
            "three-mesh-bvh": "./002.js",
            "three-bvh-csg": "./003.js"
        }
    }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { MeshBVH } from 'three-mesh-bvh';
        import { CSG } from 'three-bvh-csg';

        const info = document.getElementById('info');
        try {
            info.textContent = `Three.js ${THREE.REVISION}，构建 BVH...`;
            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x111122);
            const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 1000);
            camera.position.set(3, 2, 5);
            camera.lookAt(0,0,0);
            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(innerWidth, innerHeight);
            document.body.appendChild(renderer.domElement);

            const boxGeo = new THREE.BoxGeometry(1.5,1.5,1.5);
            const sphereGeo = new THREE.SphereGeometry(0.9,32,32);
            const sphereMesh = new THREE.Mesh(sphereGeo);
            sphereMesh.position.set(0.7,0.7,0.7);

            boxGeo.boundsTree = new MeshBVH(boxGeo);
            sphereGeo.boundsTree = new MeshBVH(sphereGeo);

            const result = CSG.subtract(new THREE.Mesh(boxGeo), sphereMesh);
            if (!result) throw new Error('结果为 null');
            scene.add(result.isMesh ? result : (result.mesh || result));

            scene.add(new THREE.AmbientLight(0x404040,0.6));
            const dir = new THREE.DirectionalLight(0xffffff,1);
            dir.position.set(1,2,1);
            scene.add(dir);
            scene.add(new THREE.GridHelper(4,20));

            const obj = scene.children.find(c => c.isMesh);
            function animate() {
                requestAnimationFrame(animate);
                if (obj) obj.rotation.y += 0.005;
                renderer.render(scene, camera);
            }
            animate();
            window.addEventListener('resize', () => {
                camera.aspect = innerWidth/innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(innerWidth, innerHeight);
            });
            info.textContent = '✅ 本地测试成功！布尔减法完成';
        } catch (e) {
            info.textContent = '❌ ' + e.message;
            info.style.background = 'rgba(200,0,0,0.8)';
            console.error(e);
        }
    </script>
</body>
</html>
