<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试 001/002/003.js - 布尔运算</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: Arial; }
        #info {
            position: absolute; top: 20px; left: 20px;
            background: rgba(0,0,0,0.7); color: white;
            padding: 10px 20px; border-radius: 5px;
            pointer-events: none; z-index: 10; max-width: 90%;
        }
    </style>
</head>
<body>
    <div id="info">正在加载...</div>

    <!-- 导入映射：指向本地三个文件 -->
    <script type="importmap">
    {
        "imports": {
            "three": "./001.js",
            "three-mesh-bvh": "./002.js",
            "three-bvh-csg": "./003.js"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { MeshBVH } from 'three-mesh-bvh';
        import { Brush, Evaluator, SUBTRACTION } from 'three-bvh-csg';

        const infoDiv = document.getElementById('info');

        try {
            // 基本检查
            if (!THREE || !MeshBVH || !Brush || !Evaluator) {
                throw new Error('模块导入失败，请检查 001/002/003.js 文件');
            }

            infoDiv.textContent = 'Three.js ' + THREE.REVISION + ' | 构建 BVH...';

            // 场景初始化
            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a2e);
            const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.1, 1000);
            camera.position.set(3, 2, 5);
            camera.lookAt(0, 0, 0);
            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(innerWidth, innerHeight);
            document.body.appendChild(renderer.domElement);

            // 准备几何体：立方体 + 球体
            const boxGeo = new THREE.BoxGeometry(1.5, 1.5, 1.5);
            const sphereGeo = new THREE.SphereGeometry(0.9, 32, 32);

            // 为两个几何体构建 BVH（加速结构）
            boxGeo.boundsTree = new MeshBVH(boxGeo);
            sphereGeo.boundsTree = new MeshBVH(sphereGeo);

            // 创建 Brush（画笔）
            const boxBrush = new Brush(boxGeo);
            const sphereBrush = new Brush(sphereGeo);
            // 移动球体，使减法效果更明显
            sphereBrush.position.set(0.7, 0.7, 0.7);
            // ★ 关键：更新世界矩阵，否则布尔运算位置错误
            sphereBrush.updateMatrixWorld();

            infoDiv.textContent = '正在执行减法（立方体 - 球体）...';

            // 执行布尔减法
            const evaluator = new Evaluator();
            const result = evaluator.evaluate(boxBrush, sphereBrush, SUBTRACTION);

            if (!result) {
                throw new Error('布尔运算返回空结果');
            }

            // 添加结果到场景
            scene.add(result);

            // 光照
            scene.add(new THREE.AmbientLight(0x404040, 0.6));
            const dirLight = new THREE.DirectionalLight(0xffffff, 1);
            dirLight.position.set(1, 2, 1);
            scene.add(dirLight);
            // 辅助网格
            const grid = new THREE.GridHelper(4, 20, 0x888888, 0x444444);
            scene.add(grid);

            // 动画：旋转结果
            function animate() {
                requestAnimationFrame(animate);
                result.rotation.y += 0.005;
                renderer.render(scene, camera);
            }
            animate();

            // 窗口大小自适应
            window.addEventListener('resize', () => {
                camera.aspect = innerWidth / innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(innerWidth, innerHeight);
            });

            infoDiv.textContent = '✅ 测试成功！立方体 - 球体 (Three.js ' + THREE.REVISION + ')';
            console.log('✅ 001/002/003.js 测试通过');

        } catch (error) {
            infoDiv.textContent = '❌ 测试失败: ' + error.message;
            infoDiv.style.background = 'rgba(200,0,0,0.8)';
            console.error(error);
        }
    </script>
</body>
</html>
