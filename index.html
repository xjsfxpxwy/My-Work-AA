<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>测试 010 (FXAAShader)</title>
</head>
<body>
    <pre id="log"></pre>

    <script type="importmap">
    {
        "imports": {
            "three": "./001.js",
            "three/addons/postprocessing/EffectComposer.js": "./postprocessing/EffectComposer.js",
            "three/addons/postprocessing/FullScreenQuad.js": "./postprocessing/FullScreenQuad.js",
            "three/addons/postprocessing/MaskPass.js": "./postprocessing/MaskPass.js",
            "three/addons/postprocessing/RenderPass.js": "./postprocessing/RenderPass.js",
            "three/addons/postprocessing/ShaderPass.js": "./postprocessing/ShaderPass.js",
            "three/addons/shaders/CopyShader.js": "./shaders/CopyShader.js",
            "three/addons/shaders/FXAAShader.js": "./shaders/FXAAShader.js",
            "three/addons/postprocessing/Pass.js": "./postprocessing/FullScreenQuad.js"
        }
    }
    </script>

    <script type="module">
        const log = document.getElementById('log');
        const print = (msg, color = 'white') => {
            log.innerHTML += `<span style="color:${color}">${msg}</span>\n`;
        };

        print('🔍 测试 010 (FXAAShader)\n');

        try {
            print('⏳ 加载 Three.js...');
            const THREE = await import('three');
            print(`✅ Three.js 加载成功，版本 ${THREE.REVISION}`, 'lime');

            print('⏳ 加载 EffectComposer...');
            const ec = await import('three/addons/postprocessing/EffectComposer.js');
            print('✅ EffectComposer 加载成功', 'lime');

            print('⏳ 加载 RenderPass...');
            const rp = await import('three/addons/postprocessing/RenderPass.js');
            print('✅ RenderPass 加载成功', 'lime');

            print('⏳ 加载 ShaderPass...');
            const sp = await import('three/addons/postprocessing/ShaderPass.js');
            print('✅ ShaderPass 加载成功', 'lime');

            print('⏳ 加载 FXAAShader...');
            const fxs = await import('three/addons/shaders/FXAAShader.js');
            print('✅ FXAAShader 加载成功', 'lime');
            print('FXAAShader 导出: ' + Object.keys(fxs).join(', '));

            if (!fxs.FXAAShader) {
                throw new Error('FXAAShader 未正确导出');
            }

            // 简单实例化测试
            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera();
            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(100, 100);

            const composer = new ec.EffectComposer(renderer);
            const renderPass = new rp.RenderPass(scene, camera);
            composer.addPass(renderPass);

            const fxaaPass = new sp.ShaderPass(fxs.FXAAShader);
            const pixelRatio = renderer.getPixelRatio();
            fxaaPass.uniforms['resolution'].value.set(
                1 / (100 * pixelRatio),
                1 / (100 * pixelRatio)
            );
            fxaaPass.renderToScreen = true;
            composer.addPass(fxaaPass);

            print('✅ FXAAShader 通过 ShaderPass 实例化成功，后处理管线完整', 'lime');
            renderer.dispose();
        } catch (err) {
            print('❌ 失败: ' + err.message, 'red');
            console.error(err);
        }
    </script>
</body>
</html>
