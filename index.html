<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>依赖诊断测试：001-005.js</title>
    <style>
        /* 样式基本保持不变，增加错误提示区域 */
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #0d0d1a;
        }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            padding: 12px 24px;
            border-radius: 8px;
            z-index: 10;
            font-size: 14px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            max-width: 70%;
            pointer-events: none;
        }
        #info .badge {
            display: inline-block;
            background: #2ecc71;
            color: #fff;
            border-radius: 12px;
            padding: 0 10px;
            font-size: 12px;
            line-height: 22px;
            margin-left: 8px;
            font-weight: 600;
        }
        #info .badge.error {
            background: #e74c3c;
        }
        #status-dots {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 8px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.6);
            padding: 8px 14px;
            border-radius: 20px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            display: inline-block;
            transition: all 0.3s;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .dot.loaded {
            background: #2ecc71;
            box-shadow: 0 0 12px rgba(46, 204, 113, 0.5);
        }
        .dot.pending {
            background: #f39c12;
            animation: pulse 1.2s ease-in-out infinite;
        }
        .dot.error {
            background: #e74c3c;
            box-shadow: 0 0 12px rgba(231, 76, 60, 0.5);
            animation: none;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.8); }
        }
        #gui-tip {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.3);
            font-size: 13px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.4);
            padding: 6px 18px;
            border-radius: 20px;
            backdrop-filter: blur(4px);
            pointer-events: none;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        #error-console {
            position: absolute;
            bottom: 80px;
            left: 20px;
            right: 20px;
            max-width: 600px;
            background: rgba(200, 0, 0, 0.85);
            color: #fff;
            padding: 12px 18px;
            border-radius: 8px;
            font-size: 13px;
            font-family: monospace;
            white-space: pre-wrap;
            word-break: break-all;
            z-index: 20;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            display: none;
            pointer-events: none;
        }
        #error-console.visible {
            display: block;
        }
        @media (max-width: 640px) {
            #info { font-size: 12px; padding: 8px 14px; top: 12px; left: 12px; }
            #status-dots { top: 12px; right: 12px; padding: 6px 10px; }
            .dot { width: 10px; height: 10px; }
            #gui-tip { font-size: 11px; padding: 4px 12px; bottom: 16px; }
        }
    </style>
</head>
<body>
    <div id="info">⏳ 正在加载依赖...</div>
    <div id="status-dots">
        <span class="dot pending" id="dot-001" title="001.js (Three.js)"></span>
        <span class="dot pending" id="dot-002" title="002.js (MeshBVH)"></span>
        <span class="dot pending" id="dot-003" title="003.js (BVH-CSG)"></span>
        <span class="dot pending" id="dot-004" title="004.js (lil-gui)"></span>
        <span class="dot pending" id="dot-005" title="005.js (OrbitControls)"></span>
    </div>
    <div id="error-console"></div>
    <div id="gui-tip">🖱 拖拽旋转 · 滚轮缩放 · 右键平移</div>

    <!-- 导入映射：所有本地文件 -->
    <script type="importmap">
    {
        "imports": {
            "three": "./001.js",
            "three-mesh-bvh": "./002.js",
            "three-bvh-csg": "./003.js",
            "lil-gui": "./004.js",
            "three/addons/controls/OrbitControls.js": "./005.js"
        }
    }
    </script>

    <script type="module">
        // =============================================================
        // 1. DOM 元素
        // =============================================================
        const infoDiv = document.getElementById('info');
        const errorConsole = document.getElementById('error-console');
        const dots = {
            '001': document.getElementById('dot-001'),
            '002': document.getElementById('dot-002'),
            '003': document.getElementById('dot-003'),
            '004': document.getElementById('dot-004'),
            '005': document.getElementById('dot-005'),
        };

        // 辅助：更新点状态
        function setDotStatus(id, status) {
            const dot = dots[id];
            if (!dot) return;
            dot.className = `dot ${status}`;
        }

        // 显示错误信息
        function showError(msg) {
            errorConsole.textContent = msg;
            errorConsole.classList.add('visible');
            infoDiv.innerHTML = `❌ 依赖加载失败 — 请查看下方错误信息`;
            infoDiv.style.borderColor = 'rgba(255,0,0,0.4)';
        }

        // =============================================================
        // 2. 动态加载所有依赖（按顺序）
        // =============================================================
        async function loadDependencies() {
            const deps = {};

            try {
                // 2.1 加载 Three.js (001)
                setDotStatus('001', 'pending');
                deps.THREE = await import('three');
                setDotStatus('001', 'loaded');
                infoDiv.textContent = '✅ 001.js (Three.js) 加载成功';

                // 2.2 加载 MeshBVH (002)
                setDotStatus('002', 'pending');
                const bvhModule = await import('three-mesh-bvh');
                deps.MeshBVH = bvhModule.MeshBVH;
                setDotStatus('002', 'loaded');

                // 2.3 加载 BVH-CSG (003)
                setDotStatus('003', 'pending');
                const csgModule = await import('three-bvh-csg');
                deps.Brush = csgModule.Brush;
                deps.Evaluator = csgModule.Evaluator;
                deps.SUBTRACTION = csgModule.SUBTRACTION;
                setDotStatus('003', 'loaded');

                // 2.4 加载 lil-gui (004)
                setDotStatus('004', 'pending');
                const guiModule = await import('lil-gui');
                deps.GUI = guiModule.default; // 默认导出
                setDotStatus('004', 'loaded');

                // 2.5 加载 OrbitControls (005)
                setDotStatus('005', 'pending');
                const controlsModule = await import('three/addons/controls/OrbitControls.js');
                deps.OrbitControls = controlsModule.OrbitControls;
                setDotStatus('005', 'loaded');

                infoDiv.innerHTML = `✅ 全部 5 个依赖加载成功！<span class="badge">Three.js ${deps.THREE.REVISION}</span>`;
                return deps;
            } catch (err) {
                // 捕获任何加载错误
                console.error('加载依赖时出错:', err);
                // 尝试判断是哪个模块失败（通过错误信息中的URL）
                let failedId = '未知';
                if (err.message.includes('001.js')) failedId = '001';
                else if (err.message.includes('002.js')) failedId = '002';
                else if (err.message.includes('003.js')) failedId = '003';
                else if (err.message.includes('004.js')) failedId = '004';
                else if (err.message.includes('005.js')) failedId = '005';
                // 但如果错误是语法错误等，可能不包含文件名，我们标记所有未加载的为error
                for (const [id, dot] of Object.entries(dots)) {
                    if (dot.className === 'dot pending' || dot.className === 'dot') {
                        setDotStatus(id, 'error');
                    }
                }
                // 显示详细错误
                showError(`❌ 加载失败 (${failedId}): ${err.message || err}\n请检查文件是否存在及格式是否正确。`);
                throw err; // 重新抛出，停止初始化
            }
        }

        // =============================================================
        // 3. 初始化场景（依赖全部加载后）
        // =============================================================
        async function initScene(deps) {
            const { THREE, MeshBVH, Brush, Evaluator, SUBTRACTION, GUI, OrbitControls } = deps;

            // ---------- 场景 / 相机 / 渲染器 ----------
            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0d0d1a);

            const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 1000);
            camera.position.set(4, 2.5, 5);

            const renderer = new THREE.WebGLRenderer({
                antialias: true,
                powerPreference: 'high-performance',
            });
            renderer.setSize(innerWidth, innerHeight);
            renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.2;
            document.body.appendChild(renderer.domElement);

            // ---------- OrbitControls ----------
            const controls = new OrbitControls(camera, renderer.domElement);
            controls.target.set(0, 0, 0);
            controls.enableDamping = true;
            controls.dampingFactor = 0.08;
            controls.minDistance = 1.5;
            controls.maxDistance = 20;
            controls.autoRotate = false;
            controls.update();

            // ---------- 光照 ----------
            const ambientLight = new THREE.AmbientLight(0x404060, 0.5);
            scene.add(ambientLight);
            const hemiLight = new THREE.HemisphereLight(0x87ceeb, 0x362d59, 0.8);
            scene.add(hemiLight);
            const mainLight = new THREE.DirectionalLight(0xffeedd, 2.2);
            mainLight.position.set(3, 6, 4);
            mainLight.castShadow = true;
            mainLight.shadow.mapSize.width = 1024;
            mainLight.shadow.mapSize.height = 1024;
            mainLight.shadow.camera.near = 0.5;
            mainLight.shadow.camera.far = 20;
            mainLight.shadow.camera.left = -5;
            mainLight.shadow.camera.right = 5;
            mainLight.shadow.camera.top = 5;
            mainLight.shadow.camera.bottom = -5;
            scene.add(mainLight);
            const fillLight = new THREE.DirectionalLight(0x8888ff, 0.6);
            fillLight.position.set(-3, 1, -2);
            scene.add(fillLight);
            const rimLight = new THREE.DirectionalLight(0xffffff, 0.4);
            rimLight.position.set(0, -2, 4);
            scene.add(rimLight);

            // ---------- 辅助 ----------
            const gridHelper = new THREE.GridHelper(6, 24, 0x8888cc, 0x444466);
            gridHelper.position.y = -1.2;
            scene.add(gridHelper);
            const ringGeo = new THREE.TorusGeometry(1.8, 0.025, 16, 80);
            const ringMat = new THREE.MeshStandardMaterial({
                color: 0x4466aa,
                emissive: 0x224488,
                emissiveIntensity: 0.15,
                transparent: true,
                opacity: 0.3,
            });
            const ring = new THREE.Mesh(ringGeo, ringMat);
            ring.rotation.x = Math.PI / 2;
            ring.position.y = -1.15;
            scene.add(ring);

            // ---------- 布尔运算 ----------
            const boxGeo = new THREE.BoxGeometry(1.6, 1.6, 1.6);
            const sphereGeo = new THREE.SphereGeometry(0.95, 48, 48);
            boxGeo.boundsTree = new MeshBVH(boxGeo);
            sphereGeo.boundsTree = new MeshBVH(sphereGeo);

            const boxBrush = new Brush(boxGeo);
            const sphereBrush = new Brush(sphereGeo);
            sphereBrush.position.set(0.75, 0.75, 0.75);
            sphereBrush.updateMatrixWorld();

            const evaluator = new Evaluator();
            let result = evaluator.evaluate(boxBrush, sphereBrush, SUBTRACTION);
            scene.add(result);

            // ---------- 材质 ----------
            const settings = {
                rotationSpeed: 0.006,
                color: '#4cc9f0',
                roughness: 0.35,
                metalness: 0.15,
                wireframe: false,
                gridVisible: true,
                autoRotateOrbit: false,
                resetCamera: () => {
                    camera.position.set(4, 2.5, 5);
                    controls.target.set(0, 0, 0);
                    controls.update();
                },
                resetScene: () => {
                    sphereBrush.position.set(0.75, 0.75, 0.75);
                    sphereBrush.updateMatrixWorld();
                    const newResult = evaluator.evaluate(boxBrush, sphereBrush, SUBTRACTION);
                    scene.remove(result);
                    if (result.material && newResult.material) {
                        newResult.material.color.copy(result.material.color);
                        newResult.material.roughness = result.material.roughness;
                        newResult.material.metalness = result.material.metalness;
                        newResult.material.wireframe = result.material.wireframe;
                    }
                    scene.add(newResult);
                    result = newResult;
                    result.rotation.set(0, 0, 0);
                },
            };

            const material = new THREE.MeshStandardMaterial({
                color: settings.color,
                roughness: settings.roughness,
                metalness: settings.metalness,
                wireframe: settings.wireframe,
                envMapIntensity: 0.6,
            });
            result.material = material;

            function updateMaterial() {
                if (result.material) {
                    result.material.color.set(settings.color);
                    result.material.roughness = settings.roughness;
                    result.material.metalness = settings.metalness;
                    result.material.wireframe = settings.wireframe;
                    result.material.needsUpdate = true;
                }
            }

            // ---------- GUI ----------
            const gui = new GUI({ title: '🎛 控制面板', width: 300 });
            const objFolder = gui.addFolder('物体');
            objFolder.add(settings, 'rotationSpeed', 0, 0.03, 0.0005).name('自转速度');
            objFolder.addColor(settings, 'color').name('颜色').onChange(updateMaterial);
            objFolder.add(settings, 'roughness', 0, 1, 0.01).name('粗糙度').onChange(updateMaterial);
            objFolder.add(settings, 'metalness', 0, 1, 0.01).name('金属感').onChange(updateMaterial);
            objFolder.add(settings, 'wireframe').name('线框模式').onChange(updateMaterial);
            objFolder.add(settings, 'resetScene').name('↺ 重置物体');
            objFolder.open();

            const sceneFolder = gui.addFolder('场景');
            sceneFolder.add(settings, 'gridVisible').name('显示网格').onChange(v => {
                gridHelper.visible = v;
                ring.visible = v;
            });
            sceneFolder.add(settings, 'autoRotateOrbit').name('🌐 自动旋转视角').onChange(v => {
                controls.autoRotate = v;
            });
            sceneFolder.add(settings, 'resetCamera').name('📷 重置视角');
            sceneFolder.open();

            const infoFolder = gui.addFolder('系统信息');
            const infoData = {
                threeVersion: THREE.REVISION,
                depsLoaded: '5 / 5',
                csgStatus: '✅ 正常',
            };
            infoFolder.add(infoData, 'threeVersion').name('Three.js 版本').disable();
            infoFolder.add(infoData, 'depsLoaded').name('依赖加载').disable();
            infoFolder.add(infoData, 'csgStatus').name('CSG 状态').disable();
            infoFolder.open();

            // ---------- 星星 ----------
            const starsGeo = new THREE.BufferGeometry();
            const starCount = 600;
            const starPos = new Float32Array(starCount * 3);
            for (let i = 0; i < starCount * 3; i++) {
                starPos[i] = (Math.random() - 0.5) * 60;
            }
            starsGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
            const starsMat = new THREE.PointsMaterial({
                color: 0x6688cc,
                size: 0.06,
                transparent: true,
                opacity: 0.6,
                blending: THREE.AdditiveBlending,
                sizeAttenuation: true,
            });
            const stars = new THREE.Points(starsGeo, starsMat);
            scene.add(stars);

            // ---------- 窗口自适应 ----------
            window.addEventListener('resize', () => {
                const w = innerWidth;
                const h = innerHeight;
                camera.aspect = w / h;
                camera.updateProjectionMatrix();
                renderer.setSize(w, h);
            });

            // ---------- 动画循环 ----------
            function animate() {
                requestAnimationFrame(animate);
                if (result) {
                    result.rotation.y += settings.rotationSpeed;
                    const floatOffset = Math.sin(Date.now() * 0.001) * 0.04;
                    result.position.y = floatOffset;
                }
                stars.rotation.y += 0.00008;
                controls.update();
                renderer.render(scene, camera);
            }
            animate();

            // 隐藏错误控制台（如果可见）
            errorConsole.classList.remove('visible');
            infoDiv.innerHTML = `✅ 全部 5 个依赖加载成功！<span class="badge">Three.js ${THREE.REVISION}</span>`;
            infoDiv.style.borderColor = 'rgba(46, 204, 113, 0.3)';
            console.log('🚀 场景初始化完成，OrbitControls 已启用');
        }

        // =============================================================
        // 4. 主流程
        // =============================================================
        (async function main() {
            try {
                const deps = await loadDependencies();
                await initScene(deps);
            } catch (err) {
                // 错误已在 loadDependencies 中处理和显示，这里不再重复
                console.error('初始化失败:', err);
            }
        })();

        // 兜底：全局错误捕获
        window.addEventListener('error', (e) => {
            console.error('全局错误:', e);
            if (!errorConsole.classList.contains('visible')) {
                showError(`未捕获的错误: ${e.message || e}`);
            }
        });
    </script>
</body>
</html>
