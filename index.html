<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>最终后处理验证（修正版）</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        #status {
            position: absolute; top: 10px; left: 10px; color: white;
            background: rgba(0,0,0,0.7); padding: 8px 15px; border-radius: 5px;
            font-family: monospace; font-size: 14px; pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div id="status">初始化...</div>

    <!-- 使用精确映射，避免通配符问题 -->
    <script type="importmap">
    {
        "imports": {
            "three": "./001.js",
            "three/addons/postprocessing/EffectComposer.js": "./postprocessing/EffectComposer.js",
            "three/addons/postprocessing/RenderPass.js": "./postprocessing/RenderPass.js",
            "three/addons/postprocessing/ShaderPass.js": "./postprocessing/ShaderPass.js",
            "three/addons/postprocessing/Pass.js": "./postprocessing/Pass.js",
            "three/addons/shaders/CopyShader.js": "./shaders/CopyShader.js",
            "three/addons/shaders/FXAAShader.js": "./shaders/FXAAShader.js",
            "three/addons/postprocessing/FullScreenQuad.js": "./postprocessing/FullScreenQuad.js",
            "three/addons/postprocessing/MaskPass.js": "./postprocessing/MaskPass.js"
        }
    }
    </script>

    <script type="module">
        const statusDiv = document.getElementById('status');
        const log = (msg) => { statusDiv.textContent = msg; console.log(msg); };

        try {
            // 导入所有需要的模块
            const THREE = await import('three');
            log('Three.js r' + THREE.REVISION + ' 加载成功 ✅');

            const { EffectComposer } = await import('three/addons/postprocessing/EffectComposer.js');
            const { RenderPass } = await import('three/addons/postprocessing/RenderPass.js');
            const { ShaderPass } = await import('three/addons/postprocessing/ShaderPass.js');
            const { FXAAShader } = await import('three/addons/shaders/FXAAShader.js');

            // ---------- 场景构建 ----------
            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0d0d1a);

            const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 1000);
            camera.position.set(3, 2, 5);
            camera.lookAt(0, 0, 0);

            const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
            renderer.setSize(innerWidth, innerHeight);
            renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.2;
            document.body.appendChild(renderer.domElement);

            // 光照
            scene.add(new THREE.AmbientLight(0x404060, 0.5));
            const hemiLight = new THREE.HemisphereLight(0x87ceeb, 0x362d59, 0.8);
            scene.add(hemiLight);
            const mainLight = new THREE.DirectionalLight(0xffeedd, 2.2);
            mainLight.position.set(3, 6, 4);
            mainLight.castShadow = true;
            mainLight.shadow.mapSize.set(1024, 1024);
            scene.add(mainLight);
            scene.add(new THREE.DirectionalLight(0x8888ff, 0.6).position.set(-3, 1, -2));
            scene.add(new THREE.DirectionalLight(0xffffff, 0.4).position.set(0, -2, 4));

            // 一个测试用的圆环结
            const geometry = new THREE.TorusKnotGeometry(1, 0.3, 100, 16);
            const material = new THREE.MeshStandardMaterial({ color: 0x4cc9f0, roughness: 0.3, metalness: 0.1 });
            const mesh = new THREE.Mesh(geometry, material);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            scene.add(mesh);

            const gridHelper = new THREE.GridHelper(6, 24, 0x8888cc, 0x444466);
            gridHelper.position.y = -1.2;
            scene.add(gridHelper);

            // ---------- 后处理管线（修正版） ----------
            const composer = new EffectComposer(renderer);

            /**
             * ✅ 关键修复：
             * 由于最后一个 Pass (FXAA) 设置了 renderToScreen = true，
             * 因此内置的 copyPass 不再需要。
             * 显式禁用它可以避免内部渲染逻辑错误（如 scene.matrixWorldAutoUpdate 报错）。
             */
            composer.copyPass.enabled = false;
            log('EffectComposer 实例化成功 ✅');

            // 1. 必须添加 RenderPass（负责渲染主场景）
            const renderPass = new RenderPass(scene, camera);
            composer.addPass(renderPass);

            // 2. 添加 FXAA 效果通道
            const fxaaPass = new ShaderPass(FXAAShader);
            const pixelRatio = renderer.getPixelRatio();
            fxaaPass.uniforms['resolution'].value.set(
                1 / (innerWidth * pixelRatio),
                1 / (innerHeight * pixelRatio)
            );
            // 告诉 composer：这是最后一个 Pass，直接输出到屏幕
            fxaaPass.renderToScreen = true;
            composer.addPass(fxaaPass);

            // 验证通道配置
            log('后处理管线已就绪 ✅');
            console.log('--- Pass 列表 ---');
            composer.passes.forEach((pass, i) => {
                console.log(`Pass ${i}: ${pass.constructor.name}, enabled=${pass.enabled}`);
            });
            console.log('copyPass 状态:', composer.copyPass.enabled ? '启用 (异常)' : '禁用 (正常)');

            // ---------- 动画循环 ----------
            function animate() {
                requestAnimationFrame(animate);
                mesh.rotation.x += 0.005;
                mesh.rotation.y += 0.01;
                // ✅ 正确：只需调用 composer.render()
                // EffectComposer 会自动管理所有 Pass，包括内部逻辑
                composer.render();
            }
            animate();

            // 窗口大小调整
            window.addEventListener('resize', () => {
                camera.aspect = innerWidth / innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(innerWidth, innerHeight);
                composer.setSize(innerWidth, innerHeight);
                const pr = renderer.getPixelRatio();
                fxaaPass.uniforms['resolution'].value.set(
                    1 / (innerWidth * pr),
                    1 / (innerHeight * pr)
                );
            });

            log('✅ 运行中 — 旋转视角查看 FXAA 效果');

        } catch (err) {
            log('❌ 失败: ' + err.message);
            console.error('详细错误:', err);
        }
    </script>
</body>
</html>
