<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CDN 测试 three-mesh-bvh</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: Arial; }
        #info {
            position: absolute; top: 20px; left: 20px;
            background: rgba(0,0,0,0.7); color: white;
            padding: 10px 20px; border-radius: 5px;
            pointer-events: none; z-index: 10;
        }
    </style>
</head>
<body>
    <div id="info">正在从 CDN 加载...</div>

    <!-- 使用 importmap 直接指向 CDN -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three-mesh-bvh": "https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.7.4/build/index.module.js"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { MeshBVH } from 'three-mesh-bvh';

        const infoDiv = document.getElementById('info');

        try {
            infoDiv.textContent = `Three.js ${THREE.REVISION}，正在构建 BVH...`;

            // 检查 MeshBVH
            console.log('MeshBVH:', MeshBVH);
            if (typeof MeshBVH.build !== 'function') {
                throw new Error('MeshBVH.build 不是函数');
            }

            // 场景
            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x111122);
            const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 1000);
            camera.position.set(3, 2, 5);
            camera.lookAt(0, 0, 0);
            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(innerWidth, innerHeight);
            document.body.appendChild(renderer.domElement);

            const geo = new THREE.TorusKnotGeometry(1, 0.3, 100, 16);
            const mat = new THREE.MeshStandardMaterial({ color: 0x4cc9f0, roughness: 0.4 });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(0, 0.5, 0);
            scene.add(mesh);

            // 构建 BVH
            MeshBVH.build(geo);
            if (!geo.boundsTree) throw new Error('构建失败');

            scene.add(new THREE.AmbientLight(0x404040, 0.6));
            const dir = new THREE.DirectionalLight(0xffffff, 1);
            dir.position.set(1, 2, 1);
            scene.add(dir);
            scene.add(new THREE.GridHelper(4, 20, 0x888888, 0x444444));

            function animate() {
                requestAnimationFrame(animate);
                mesh.rotation.y += 0.005;
                renderer.render(scene, camera);
            }
            animate();

            window.addEventListener('resize', () => {
                camera.aspect = innerWidth/innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(innerWidth, innerHeight);
            });

            infoDiv.textContent = `✅ CDN 测试成功！BVH 已构建 (Three.js ${THREE.REVISION})`;
        } catch (e) {
            infoDiv.textContent = `❌ CDN 测试失败: ${e.message}`;
            infoDiv.style.background = 'rgba(200,0,0,0.8)';
            console.error(e);
        }
    </script>
</body>
</html>
