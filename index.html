<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>全依赖测试：001-005.js 布尔运算 + GUI + OrbitControls</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.75);
            color: #fff;
            padding: 12px 24px;
            border-radius: 8px;
            pointer-events: none;
            z-index: 10;
            font-size: 14px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }
        #info .badge {
            display: inline-block;
            background: #2ecc71;
            color: #fff;
            border-radius: 12px;
            padding: 0 10px;
            font-size: 12px;
            line-height: 22px;
            margin-left: 8px;
            font-weight: 600;
        }
        #info .badge.warn {
            background: #f39c12;
        }
        #status-dots {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 8px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.6);
            padding: 8px 14px;
            border-radius: 20px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            display: inline-block;
            transition: all 0.3s;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .dot.loaded {
            background: #2ecc71;
            box-shadow: 0 0 12px rgba(46, 204, 113, 0.5);
        }
        .dot.pending {
            background: #f39c12;
            animation: pulse 1.2s ease-in-out infinite;
        }
        .dot.error {
            background: #e74c3c;
            box-shadow: 0 0 12px rgba(231, 76, 60, 0.5);
        }
        @keyframes pulse {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.4;
                transform: scale(0.8);
            }
        }
        #gui-tip {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.4);
            font-size: 13px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.4);
            padding: 6px 18px;
            border-radius: 20px;
            backdrop-filter: blur(4px);
            pointer-events: none;
            border: 1px solid rgba(255, 255, 255, 0.05);
            letter-spacing: 0.5px;
        }
        @media (max-width: 640px) {
            #info {
                font-size: 12px;
                padding: 8px 14px;
                top: 12px;
                left: 12px;
            }
            #status-dots {
                top: 12px;
                right: 12px;
                padding: 6px 10px;
            }
            .dot {
                width: 10px;
                height: 10px;
            }
            #gui-tip {
                font-size: 11px;
                padding: 4px 12px;
                bottom: 16px;
            }
        }
    </style>
</head>
<body>
    <div id="info">
        ⏳ 初始化中...
        <span class="badge">v1.0</span>
    </div>

    <div id="status-dots">
        <span class="dot pending" id="dot-001" title="001.js (Three.js)"></span>
        <span class="dot pending" id="dot-002" title="002.js (MeshBVH)"></span>
        <span class="dot pending" id="dot-003" title="003.js (BVH-CSG)"></span>
        <span class="dot pending" id="dot-004" title="004.js (lil-gui)"></span>
        <span class="dot pending" id="dot-005" title="005.js (OrbitControls)"></span>
    </div>

    <div id="gui-tip">🖱 拖拽旋转 · 滚轮缩放 · 右键平移</div>

    <!-- ========== 导入映射：五个本地文件 ========== -->
    <script type="importmap">
        {
            "imports": {
                "three": "./001.js",
                "three-mesh-bvh": "./002.js",
                "three-bvh-csg": "./003.js",
                "lil-gui": "./004.js",
                "three/addons/controls/OrbitControls.js": "./005.js"
            }
        }
    </script>

    <script type="module">
        // ============================================================
        // 1. 导入所有依赖
        // ============================================================
        import * as THREE from 'three';
        import { MeshBVH } from 'three-mesh-bvh';
        import { Brush, Evaluator, SUBTRACTION } from 'three-bvh-csg';
        import GUI from 'lil-gui';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // 获取 DOM 元素
        const infoDiv = document.getElementById('info');
        const dots = {
            001: document.getElementById('dot-001'),
            002: document.getElementById('dot-002'),
            003: document.getElementById('dot-003'),
            004: document.getElementById('dot-004'),
            005: document.getElementById('dot-005'),
        };

        // 辅助：标记依赖加载成功
        function markLoaded(id) {
            const dot = dots[id];
            if (dot) {
                dot.className = 'dot loaded';
            }
        }

        // 标记所有依赖已加载（在导入完成后调用）
        function markAllLoaded() {
            markLoaded('001');
            markLoaded('002');
            markLoaded('003');
            markLoaded('004');
            markLoaded('005');
        }

        // ============================================================
        // 2. 场景 / 相机 / 渲染器
        // ============================================================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0d0d1a);

        const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 1000);
        camera.position.set(4, 2.5, 5);

        const renderer = new THREE.WebGLRenderer({
            antialias: true,
            powerPreference: 'high-performance',
        });
        renderer.setSize(innerWidth, innerHeight);
        renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        document.body.appendChild(renderer.domElement);

        // ============================================================
        // 3. OrbitControls（005.js 测试）
        // ============================================================
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 0, 0);
        controls.enableDamping = true;
        controls.dampingFactor = 0.08;
        controls.minDistance = 1.5;
        controls.maxDistance = 20;
        controls.autoRotate = false;
        controls.autoRotateSpeed = 2.0;
        controls.update();

        // 标记 OrbitControls 加载成功
        markLoaded('005');

        // ============================================================
        // 4. 光照
        // ============================================================
        const ambientLight = new THREE.AmbientLight(0x404060, 0.5);
        scene.add(ambientLight);

        const hemiLight = new THREE.HemisphereLight(0x87ceeb, 0x362d59, 0.8);
        scene.add(hemiLight);

        const mainLight = new THREE.DirectionalLight(0xffeedd, 2.2);
        mainLight.position.set(3, 6, 4);
        mainLight.castShadow = true;
        mainLight.shadow.mapSize.width = 1024;
        mainLight.shadow.mapSize.height = 1024;
        mainLight.shadow.camera.near = 0.5;
        mainLight.shadow.camera.far = 20;
        mainLight.shadow.camera.left = -5;
        mainLight.shadow.camera.right = 5;
        mainLight.shadow.camera.top = 5;
        mainLight.shadow.camera.bottom = -5;
        scene.add(mainLight);

        const fillLight = new THREE.DirectionalLight(0x8888ff, 0.6);
        fillLight.position.set(-3, 1, -2);
        scene.add(fillLight);

        const rimLight = new THREE.DirectionalLight(0xffffff, 0.4);
        rimLight.position.set(0, -2, 4);
        scene.add(rimLight);

        // ============================================================
        // 5. 地面 / 辅助
        // ============================================================
        const gridHelper = new THREE.GridHelper(6, 24, 0x8888cc, 0x444466);
        gridHelper.position.y = -1.2;
        scene.add(gridHelper);

        // 一个微弱的参考环
        const ringGeo = new THREE.TorusGeometry(1.8, 0.025, 16, 80);
        const ringMat = new THREE.MeshStandardMaterial({
            color: 0x4466aa,
            emissive: 0x224488,
            emissiveIntensity: 0.15,
            transparent: true,
            opacity: 0.3,
            wireframe: false,
        });
        const ring = new THREE.Mesh(ringGeo, ringMat);
        ring.rotation.x = Math.PI / 2;
        ring.position.y = -1.15;
        scene.add(ring);

        // ============================================================
        // 6. 布尔运算（CSG）核心
        // ============================================================
        const boxGeo = new THREE.BoxGeometry(1.6, 1.6, 1.6);
        const sphereGeo = new THREE.SphereGeometry(0.95, 48, 48);

        // 构建 BVH
        boxGeo.boundsTree = new MeshBVH(boxGeo);
        sphereGeo.boundsTree = new MeshBVH(sphereGeo);

        const boxBrush = new Brush(boxGeo);
        const sphereBrush = new Brush(sphereGeo);
        sphereBrush.position.set(0.75, 0.75, 0.75);
        sphereBrush.updateMatrixWorld();

        const evaluator = new Evaluator();
        let result = evaluator.evaluate(boxBrush, sphereBrush, SUBTRACTION);
        scene.add(result);

        // 标记 CSG 相关依赖加载成功
        markLoaded('002');
        markLoaded('003');

        // ============================================================
        // 7. 材质管理
        // ============================================================
        const settings = {
            rotationSpeed: 0.006,
            color: '#4cc9f0',
            roughness: 0.35,
            metalness: 0.15,
            wireframe: false,
            gridVisible: true,
            autoRotateOrbit: false,
            resetCamera: () => {
                camera.position.set(4, 2.5, 5);
                controls.target.set(0, 0, 0);
                controls.update();
            },
            resetScene: () => {
                sphereBrush.position.set(0.75, 0.75, 0.75);
                sphereBrush.updateMatrixWorld();
                const newResult = evaluator.evaluate(boxBrush, sphereBrush, SUBTRACTION);
                scene.remove(result);
                // 复制材质属性
                if (result.material && newResult.material) {
                    newResult.material.color.copy(result.material.color);
                    newResult.material.roughness = result.material.roughness;
                    newResult.material.metalness = result.material.metalness;
                    newResult.material.wireframe = result.material.wireframe;
                }
                scene.add(newResult);
                result = newResult;
                // 重置旋转
                result.rotation.set(0, 0, 0);
            },
        };

        // 初始材质
        const initialMaterial = new THREE.MeshStandardMaterial({
            color: settings.color,
            roughness: settings.roughness,
            metalness: settings.metalness,
            wireframe: settings.wireframe,
            envMapIntensity: 0.6,
        });
        if (result.material) {
            // 保留原有材质属性，但替换为我们的
            const oldMat = result.material;
            initialMaterial.color.copy(oldMat.color || settings.color);
            initialMaterial.roughness = oldMat.roughness || settings.roughness;
            initialMaterial.metalness = oldMat.metalness || settings.metalness;
            initialMaterial.wireframe = oldMat.wireframe || settings.wireframe;
            result.material = initialMaterial;
        } else {
            result.material = initialMaterial;
        }

        function updateMaterial() {
            if (result.material) {
                result.material.color.set(settings.color);
                result.material.roughness = settings.roughness;
                result.material.metalness = settings.metalness;
                result.material.wireframe = settings.wireframe;
                result.material.needsUpdate = true;
            }
        }

        // ============================================================
        // 8. GUI 控制面板（004.js 测试）
        // ============================================================
        const gui = new GUI({
            title: '🎛 控制面板',
            width: 300,
        });

        // ---- 物体 ----
        const objFolder = gui.addFolder('物体');
        objFolder.add(settings, 'rotationSpeed', 0, 0.03, 0.0005).name('自转速度');
        objFolder.addColor(settings, 'color').name('颜色').onChange(updateMaterial);
        objFolder.add(settings, 'roughness', 0, 1, 0.01).name('粗糙度').onChange(updateMaterial);
        objFolder.add(settings, 'metalness', 0, 1, 0.01).name('金属感').onChange(updateMaterial);
        objFolder.add(settings, 'wireframe').name('线框模式').onChange(updateMaterial);
        objFolder.add(settings, 'resetScene').name('↺ 重置物体');
        objFolder.open();

        // ---- 场景 ----
        const sceneFolder = gui.addFolder('场景');
        sceneFolder.add(settings, 'gridVisible').name('显示网格').onChange(v => {
            gridHelper.visible = v;
            ring.visible = v;
        });
        sceneFolder.add(settings, 'autoRotateOrbit').name('🌐 自动旋转视角').onChange(v => {
            controls.autoRotate = v;
        });
        sceneFolder.add(settings, 'resetCamera').name('📷 重置视角');
        sceneFolder.open();

        // ---- 信息 ----
        const infoFolder = gui.addFolder('系统信息');
        const infoData = {
            threeVersion: THREE.REVISION,
            depsLoaded: '5 / 5',
            csgStatus: '✅ 正常',
        };
        infoFolder.add(infoData, 'threeVersion').name('Three.js 版本').disable();
        infoFolder.add(infoData, 'depsLoaded').name('依赖加载').disable();
        infoFolder.add(infoData, 'csgStatus').name('CSG 状态').disable();
        infoFolder.open();

        // 标记 lil-gui 加载成功
        markLoaded('004');

        // ============================================================
        // 9. 场景装饰（小粒子背景）
        // ============================================================
        const starsGeo = new THREE.BufferGeometry();
        const starCount = 600;
        const starPos = new Float32Array(starCount * 3);
        for (let i = 0; i < starCount * 3; i++) {
            starPos[i] = (Math.random() - 0.5) * 60;
        }
        starsGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        const starsMat = new THREE.PointsMaterial({
            color: 0x6688cc,
            size: 0.06,
            transparent: true,
            opacity: 0.6,
            blending: THREE.AdditiveBlending,
            sizeAttenuation: true,
        });
        const stars = new THREE.Points(starsGeo, starsMat);
        stars.position.y = 0;
        scene.add(stars);

        // ============================================================
        // 10. 窗口自适应
        // ============================================================
        window.addEventListener('resize', () => {
            const w = innerWidth;
            const h = innerHeight;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        });

        // ============================================================
        // 11. 动画循环
        // ============================================================
        function animate() {
            requestAnimationFrame(animate);

            // 物体自转
            if (result) {
                result.rotation.y += settings.rotationSpeed;
                // 轻微上下浮动，增加动感
                const floatOffset = Math.sin(Date.now() * 0.001) * 0.04;
                result.position.y = floatOffset;
            }

            // 星星缓慢旋转
            stars.rotation.y += 0.00008;

            // 更新 OrbitControls（支持阻尼和自动旋转）
            controls.update();

            renderer.render(scene, camera);
        }

        animate();

        // ============================================================
        // 12. 完成加载
        // ============================================================
        markAllLoaded();
        infoDiv.innerHTML = `
            ✅ 全部 5 个依赖加载成功！
            <span class="badge">Three.js ${THREE.REVISION}</span>
            <span class="badge" style="background:#8e44ad;">OrbitControls ✓</span>
        `;
        infoDiv.style.background = 'rgba(0,0,0,0.8)';
        infoDiv.style.borderColor = 'rgba(46, 204, 113, 0.3)';

        console.log('✅ 001~005.js 全部测试通过！');
        console.log(`📦 Three.js r${THREE.REVISION} | OrbitControls 已激活`);

        // ============================================================
        // 13. 错误捕获（兜底）
        // ============================================================
        window.addEventListener('error', (e) => {
            infoDiv.innerHTML = `❌ 运行时错误: ${e.message}`;
            infoDiv.style.background = 'rgba(200,0,0,0.85)';
            infoDiv.style.borderColor = 'rgba(255,0,0,0.3)';
            console.error('❌ 运行时错误:', e);
            // 标记所有为错误状态
            Object.values(dots).forEach(d => {
                if (d.className !== 'dot loaded') {
                    d.className = 'dot error';
                }
            });
        });

        // 监听未捕获的 Promise 错误
        window.addEventListener('unhandledrejection', (e) => {
            console.error('❌ 未处理的 Promise 错误:', e.reason);
            infoDiv.innerHTML = `❌ Promise 错误: ${e.reason?.message || e.reason}`;
            infoDiv.style.background = 'rgba(200,0,0,0.85)';
        });

        console.log('🚀 测试页面已完全初始化');
    </script>
</body>
</html>
