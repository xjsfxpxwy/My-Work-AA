<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>布尔运算测试 - 001/002/003</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: Arial; }
        #info {
            position: absolute; top: 20px; left: 20px;
            background: rgba(0,0,0,0.7); color: white;
            padding: 10px 20px; border-radius: 5px;
            pointer-events: none; z-index: 10;
        }
    </style>
</head>
<body>
    <div id="info">正在加载...</div>

    <script type="importmap">
    {
        "imports": {
            "three": "./001.js",
            "three-mesh-bvh": "./002.js",
            "three-bvh-csg": "./003.js"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { MeshBVH } from 'three-mesh-bvh';
        import { Brush, Evaluator, SUBTRACTION } from 'three-bvh-csg';

        const info = document.getElementById('info');

        try {
            info.textContent = 'Three.js ' + THREE.REVISION + ' | 构建 BVH...';

            // 场景
            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x111122);
            const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 1000);
            camera.position.set(3, 2, 5);
            camera.lookAt(0, 0, 0);
            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(innerWidth, innerHeight);
            document.body.appendChild(renderer.domElement);

            // 几何体
            const boxGeo = new THREE.BoxGeometry(1.5, 1.5, 1.5);
            const sphereGeo = new THREE.SphereGeometry(0.9, 32, 32);

            // 构建 BVH
            boxGeo.boundsTree = new MeshBVH(boxGeo);
            sphereGeo.boundsTree = new MeshBVH(sphereGeo);

            // 创建 Brush
            const boxBrush = new Brush(boxGeo);
            const sphereBrush = new Brush(sphereGeo);
            sphereBrush.position.set(0.7, 0.7, 0.7);
            sphereBrush.updateMatrixWorld(); // 必须调用！

            // 执行减法
            const evaluator = new Evaluator();
            const result = evaluator.evaluate(boxBrush, sphereBrush, SUBTRACTION);
            if (!result) throw new Error('减法返回空');
            scene.add(result);

            // 光照与辅助
            scene.add(new THREE.AmbientLight(0x404040, 0.6));
            const dir = new THREE.DirectionalLight(0xffffff, 1);
            dir.position.set(1, 2, 1);
            scene.add(dir);
            scene.add(new THREE.GridHelper(4, 20, 0x888888, 0x444444));

            // 旋转
            function animate() {
                requestAnimationFrame(animate);
                result.rotation.y += 0.005;
                renderer.render(scene, camera);
            }
            animate();

            window.addEventListener('resize', () => {
                camera.aspect = innerWidth/innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(innerWidth, innerHeight);
            });

            info.textContent = '✅ 布尔运算成功！立方体 - 球体 (Three.js ' + THREE.REVISION + ')';
        } catch (e) {
            info.textContent = '❌ 错误: ' + e.message;
            info.style.background = 'rgba(200,0,0,0.8)';
            console.error(e);
        }
    </script>
</body>
</html>
