<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>003.js 纯导入测试</title>
    <style>
        body { background: #111; color: white; font-family: monospace; padding: 20px; }
    </style>
</head>
<body>
    <h1>003.js 加载测试</h1>
    <pre id="log"></pre>

    <script type="importmap">
    {
        "imports": {
            "three": "./001.js",
            "three-mesh-bvh": "./002.js",
            "three-bvh-csg": "./003.js"
        }
    }
    </script>

    <script type="module">
        const log = document.getElementById('log');
        function addLine(msg) {
            log.textContent += msg + '\n';
            console.log(msg);
        }

        addLine('开始导入...');

        try {
            const csgModule = await import('three-bvh-csg');
            addLine('✅ 导入成功');
            addLine('模块导出: ' + Object.keys(csgModule).join(', '));
            addLine('CSG 类型: ' + typeof csgModule.CSG);
            if (csgModule.CSG) {
                addLine('CSG.subtract: ' + typeof csgModule.CSG.subtract);
                addLine('CSG.union: ' + typeof csgModule.CSG.union);
            } else {
                addLine('❌ CSG 未导出');
            }
        } catch (e) {
            addLine('❌ 导入失败: ' + e.message);
            console.error(e);
        }
    </script>
</body>
</html>
