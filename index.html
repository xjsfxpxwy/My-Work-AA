<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>后处理最终稳定版（CDN）</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        #status {
            position: absolute; top: 10px; left: 10px; color: white;
            background: rgba(0,0,0,0.7); padding: 8px 15px;
            font-family: monospace; font-size: 14px;
        }
    </style>
</head>
<body>
<div id="status">加载中...</div>

<script type="importmap">
{
    "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
}
</script>

<script type="module">
const status = document.getElementById('status');
const log = msg => {
    console.log(msg);
    status.textContent = msg;
};

try {
    const THREE = await import('three');
    log('✅ Three.js r' + THREE.REVISION);

    const { EffectComposer } = await import('three/addons/postprocessing/EffectComposer.js');
    const { RenderPass } = await import('three/addons/postprocessing/RenderPass.js');
    const { ShaderPass } = await import('three/addons/postprocessing/ShaderPass.js');
    const { FXAAShader } = await import('three/addons/shaders/FXAAShader.js');

    // --- 基础场景 ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0d0d1a);

    const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 1000);
    camera.position.set(3, 2, 5);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    // --- 简单测试物体 ---
    const mesh = new THREE.Mesh(
        new THREE.TorusKnotGeometry(1, 0.3, 100, 16),
        new THREE.MeshStandardMaterial({ color: 0x4cc9f0 })
    );
    scene.add(mesh);
    scene.add(new THREE.AmbientLight(0x404060, 0.5));
    scene.add(new THREE.DirectionalLight(0xffeedd, 1));

    // --- 后处理（最安全写法）---
    const composer = new EffectComposer(renderer);

    // ✅ 关键点：RenderPass 必须第一个
    const renderPass = new RenderPass(scene, camera);
    composer.addPass(renderPass);

    // ✅ FXAA 作为最后一个 Pass
    const fxaa = new ShaderPass(FXAAShader);
    fxaa.uniforms['resolution'].value.set(
        1 / (innerWidth * renderer.getPixelRatio()),
        1 / (innerHeight * renderer.getPixelRatio())
    );
    fxaa.renderToScreen = true;
    composer.addPass(fxaa);

    // ✅ 禁用 copyPass（因为 fxaa 已经 renderToScreen）
    composer.copyPass.enabled = false;

    log('✅ 后处理初始化完成');

    // --- 动画 ---
    function animate() {
        requestAnimationFrame(animate);
        mesh.rotation.x += 0.005;
        mesh.rotation.y += 0.01;
        composer.render(); // ✅ 唯一正确的调用
    }
    animate();

    window.addEventListener('resize', () => {
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
        composer.setSize(innerWidth, innerHeight);
    });

} catch (err) {
    log('❌ ' + err.message);
    console.error(err);
}
</script>
</body>
</html>
