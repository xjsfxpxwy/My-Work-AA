<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>最终诊断：copyPass._scene</title>
    <style>
        body { margin: 20px; background: #111; color: #fff; font-family: monospace; }
        pre { background: #222; padding: 15px; border-radius: 5px; }
        .ok { color: #2ecc71; }
        .fail { color: #e74c3c; }
    </style>
</head>
<body>
    <h2>最终诊断：copyPass 内部 _scene</h2>
    <pre id="log"></pre>

    <script type="importmap">
    {
        "imports": {
            "three": "./001.js",
            "three/addons/postprocessing/EffectComposer.js": "./postprocessing/EffectComposer.js",
            "three/addons/postprocessing/FullScreenQuad.js": "./postprocessing/FullScreenQuad.js",
            "three/addons/postprocessing/MaskPass.js": "./postprocessing/MaskPass.js"
        }
    }
    </script>

    <script type="module">
        const log = document.getElementById('log');
        const print = (msg, color = 'white') => {
            log.innerHTML += `<span style="color:${color}">${msg}</span>\n`;
        };

        try {
            const THREE = await import('three');
            print('✅ Three.js 加载成功', 'ok');

            const ecModule = await import('three/addons/postprocessing/EffectComposer.js');
            const { EffectComposer } = ecModule;
            print('EffectComposer 导入成功', 'ok');

            // 直接导入 FullScreenQuad 以查看其结构
            const fsqModule = await import('three/addons/postprocessing/FullScreenQuad.js');
            const { FullScreenQuad } = fsqModule;
            print('FullScreenQuad 导入成功', 'ok');

            // 创建一个简单的 ShaderMaterial 供实例化
            const material = new THREE.ShaderMaterial({
                uniforms: {},
                vertexShader: 'void main() { gl_Position = vec4(position, 1.0); }',
                fragmentShader: 'void main() { gl_FragColor = vec4(1.0,0.0,0.0,1.0); }'
            });

            // 手动创建一个 FullScreenQuad 实例，查看 _scene
            const manualQuad = new FullScreenQuad(material);
            print('手动创建的 FullScreenQuad._scene: ' + (manualQuad._scene instanceof THREE.Scene), 'ok');

            // 创建 EffectComposer
            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(100, 100);
            const composer = new EffectComposer(renderer);

            // 检查 copyPass 和它的 _scene
            if (!composer.copyPass) {
                throw new Error('composer.copyPass 不存在');
            }
            print('composer.copyPass 存在', 'ok');

            // copyPass 内部是一个 ShaderPass，它的 .fsQuad 才是 FullScreenQuad 实例
            if (composer.copyPass.fsQuad) {
                const fsq = composer.copyPass.fsQuad;
                print('fsQuad 存在', 'ok');
                print('fsQuad._scene: ' + (fsq._scene instanceof THREE.Scene), 'ok');
                if (!fsq._scene) {
                    throw new Error('❌ fsQuad._scene 未定义！请重新替换 postprocessing/FullScreenQuad.js');
                }
            } else {
                print('copyPass.fsQuad 不存在，尝试访问 .quad...', 'warn');
                if (composer.copyPass.quad) {
                    print('quad._scene: ' + (composer.copyPass.quad._scene instanceof THREE.Scene), 'ok');
                } else {
                    print('无法找到 FullScreenQuad 实例，EffectComposer 内部结构可能异常。');
                }
            }

            // 尝试执行 copyPass.render
            const size = renderer.getSize(new THREE.Vector2());
            const rt1 = new THREE.WebGLRenderTarget(size.width * renderer.getPixelRatio(), size.height * renderer.getPixelRatio(), { type: THREE.HalfFloatType });
            const rt2 = rt1.clone();
            print('尝试 composer.copyPass.render()...');
            composer.copyPass.render(renderer, rt1, rt2, 0.016, false);
            print('✅ copyPass.render() 执行成功！', 'ok');

            rt1.dispose();
            rt2.dispose();
            renderer.dispose();

        } catch (err) {
            print('❌ 错误: ' + err.message, 'fail');
            console.error(err);
        }
    </script>
</body>
</html>
