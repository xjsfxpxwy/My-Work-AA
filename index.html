<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CDN 布尔运算测试</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: Arial; }
        #info {
            position: absolute; top: 20px; left: 20px;
            background: rgba(0,0,0,0.7); color: white;
            padding: 10px 20px; border-radius: 5px;
            pointer-events: none; z-index: 10; max-width: 90%;
        }
    </style>
</head>
<body>
    <div id="info">正在加载（CDN）...</div>

    <!-- 使用 importmap 指向 CDN -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three-mesh-bvh": "https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.7.4/build/index.module.js",
            "three-bvh-csg": "https://cdn.jsdelivr.net/npm/three-bvh-csg@0.1.0/src/index.js"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { MeshBVH } from 'three-mesh-bvh';
        import { CSG } from 'three-bvh-csg';

        const infoDiv = document.getElementById('info');

        // 超时保护：如果 5 秒后还没成功，显示超时
        const timeout = setTimeout(() => {
            infoDiv.textContent = '⚠️ 加载超时，请检查网络或 F12 控制台';
            infoDiv.style.background = 'rgba(200,100,0,0.8)';
        }, 5000);

        try {
            infoDiv.textContent = `Three.js ${THREE.REVISION}，构建 BVH...`;

            // 场景
            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x111122);
            const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 1000);
            camera.position.set(3, 2, 5);
            camera.lookAt(0, 0, 0);
            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(innerWidth, innerHeight);
            document.body.appendChild(renderer.domElement);

            const boxGeo = new THREE.BoxGeometry(1.5, 1.5, 1.5);
            const sphereGeo = new THREE.SphereGeometry(0.9, 32, 32);
            const sphereMesh = new THREE.Mesh(sphereGeo);
            sphereMesh.position.set(0.7, 0.7, 0.7);

            // BVH 构建（正确方式）
            boxGeo.boundsTree = new MeshBVH(boxGeo);
            sphereGeo.boundsTree = new MeshBVH(sphereGeo);

            // 布尔减法
            const result = CSG.subtract(
                new THREE.Mesh(boxGeo),
                sphereMesh
            );

            if (!result) throw new Error('减法结果为空');

            scene.add(result.isMesh ? result : (result.mesh || result));

            // 光照
            scene.add(new THREE.AmbientLight(0x404040, 0.6));
            const dir = new THREE.DirectionalLight(0xffffff, 1);
            dir.position.set(1, 2, 1);
            scene.add(dir);
            scene.add(new THREE.GridHelper(4, 20, 0x888888, 0x444444));

            const obj = scene.children.find(c => c.isMesh);
            function animate() {
                requestAnimationFrame(animate);
                if (obj) obj.rotation.y += 0.005;
                renderer.render(scene, camera);
            }
            animate();

            window.addEventListener('resize', () => {
                camera.aspect = innerWidth/innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(innerWidth, innerHeight);
            });

            clearTimeout(timeout);
            infoDiv.textContent = `✅ CDN 测试成功！布尔减法已完成 (立方体 - 球体)`;
            infoDiv.style.background = 'rgba(0,0,0,0.7)';
        } catch (e) {
            clearTimeout(timeout);
            infoDiv.textContent = `❌ 失败: ${e.message}`;
            infoDiv.style.background = 'rgba(200,0,0,0.8)';
            console.error(e);
        }
    </script>
</body>
</html>
