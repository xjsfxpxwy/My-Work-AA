<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>测试 006 EffectComposer</title>
    <style>
        body { background: #0d0d1a; color: #fff; font-family: monospace; padding: 20px; }
        #log { white-space: pre-wrap; font-size: 14px; }
        .ok { color: #2ecc71; }
        .err { color: #e74c3c; }
    </style>
</head>
<body>
    <pre id="log">🔍 测试 006 (EffectComposer)\n</pre>
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.163.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.163.0/examples/jsm/"
        }
    }
    </script>
    <script type="module">
        const log = document.getElementById('log');
        const print = (msg, cls = '') => log.innerHTML += `<span class="${cls}">${msg}</span>\n`;

        try {
            const THREE = await import('three');
            print(`✅ Three.js ${THREE.REVISION} 加载成功`, 'ok');

            const { EffectComposer } = await import('three/addons/postprocessing/EffectComposer.js');
            print('✅ EffectComposer 加载成功', 'ok');

            // 实例化测试
            const renderer = new THREE.WebGLRenderer();
            const composer = new EffectComposer(renderer);
            print('✅ EffectComposer 实例化成功', 'ok');
            renderer.dispose();

            print('\n🎉 测试通过！', 'ok');
        } catch (err) {
            print(`❌ 失败: ${err.message}`, 'err');
            console.error(err);
        }
    </script>
</body>
</html>
