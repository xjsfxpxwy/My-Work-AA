<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <title>测试 007 (RenderPass)</title>
</head>
<body>
    <pre id="log"></pre>

    <!-- 精确映射，避免通配符问题 -->
    <script type="importmap">
    {
        "imports": {
            "three": "./001.js",
            "three/addons/postprocessing/EffectComposer.js": "./postprocessing/EffectComposer.js",
            "three/addons/postprocessing/FullScreenQuad.js": "./postprocessing/FullScreenQuad.js",
            "three/addons/postprocessing/RenderPass.js": "./postprocessing/RenderPass.js",
            "three/addons/postprocessing/Pass.js": "./postprocessing/FullScreenQuad.js"
        }
    }
    </script>

    <script type="module">
        const log = document.getElementById('log');
        const print = (msg, color = 'white') => {
            log.innerHTML += `<span style="color:${color}">${msg}</span>\n`;
        };

        print('🔍 测试 006 + 007 (RenderPass)\n');

        try {
            print('⏳ 加载 Three.js...');
            const THREE = await import('three');
            print(`✅ Three.js 加载成功，版本 ${THREE.REVISION}`, 'lime');

            print('⏳ 加载 EffectComposer...');
            const ec = await import('three/addons/postprocessing/EffectComposer.js');
            print('✅ EffectComposer 加载成功', 'lime');

            print('⏳ 加载 RenderPass...');
            const rp = await import('three/addons/postprocessing/RenderPass.js');
            print('✅ RenderPass 加载成功', 'lime');
            print('RenderPass 导出: ' + Object.keys(rp).join(', '));

            if (typeof rp.RenderPass !== 'function') {
                throw new Error('RenderPass 不是一个构造函数');
            }

            // 简单验证：创建一个场景和相机，然后尝试实例化 EffectComposer 和 RenderPass（不渲染）
            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera();
            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(100, 100);

            const composer = new ec.EffectComposer(renderer);
            const renderPass = new rp.RenderPass(scene, camera);
            composer.addPass(renderPass);

            print('✅ EffectComposer 和 RenderPass 实例化成功，后处理管线可以搭建', 'lime');

            // 清理（可选）
            renderer.dispose();
        } catch (err) {
            print('❌ 失败: ' + err.message, 'red');
            console.error(err);
        }
    </script>
</body>
</html>
