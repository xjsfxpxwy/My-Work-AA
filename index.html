<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>EffectComposer.copyPass 诊断</title>
    <style>
        body { margin: 20px; background: #111; color: #fff; font-family: monospace; }
        pre { background: #222; padding: 15px; border-radius: 5px; }
        .ok { color: #2ecc71; }
        .fail { color: #e74c3c; }
    </style>
</head>
<body>
    <h2>EffectComposer.copyPass 诊断</h2>
    <pre id="log"></pre>

    <script type="importmap">
    {
        "imports": {
            "three": "./001.js",
            "three/addons/postprocessing/EffectComposer.js": "./postprocessing/EffectComposer.js",
            "three/addons/postprocessing/FullScreenQuad.js": "./postprocessing/FullScreenQuad.js",
            "three/addons/postprocessing/MaskPass.js": "./postprocessing/MaskPass.js",
            "three/addons/postprocessing/RenderPass.js": "./postprocessing/RenderPass.js",
            "three/addons/postprocessing/ShaderPass.js": "./postprocessing/ShaderPass.js",
            "three/addons/shaders/CopyShader.js": "./shaders/CopyShader.js",
            "three/addons/shaders/FXAAShader.js": "./shaders/FXAAShader.js",
            "three/addons/postprocessing/Pass.js": "./postprocessing/FullScreenQuad.js"
        }
    }
    </script>

    <script type="module">
        const log = document.getElementById('log');
        const print = (msg, color = 'white') => {
            log.innerHTML += `<span style="color:${color}">${msg}</span>\n`;
        };

        try {
            const THREE = await import('three');
            print('✅ Three.js 加载成功', 'ok');

            const { EffectComposer } = await import('three/addons/postprocessing/EffectComposer.js');
            print('✅ EffectComposer 加载成功', 'ok');

            const { RenderPass } = await import('three/addons/postprocessing/RenderPass.js');
            print('✅ RenderPass 加载成功', 'ok');

            // 创建最小场景
            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x111122);
            const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 1000);
            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(100, 100);
            document.body.appendChild(renderer.domElement);

            // 创建 EffectComposer，但不添加任何 pass
            const composer = new EffectComposer(renderer);
            print('✅ EffectComposer 实例化成功', 'ok');

            // 检查 copyPass 是否正常
            if (!composer.copyPass) {
                throw new Error('composer.copyPass 未定义');
            }
            print('composer.copyPass 存在', 'ok');

            // 尝试手动调用 copyPass.render()（模拟内部缓冲区交换）
            // 需要两个 WebGLRenderTarget 作为读写缓冲区
            const size = renderer.getSize(new THREE.Vector2());
            const rt1 = new THREE.WebGLRenderTarget(size.width * renderer.getPixelRatio(), size.height * renderer.getPixelRatio(), { type: THREE.HalfFloatType });
            const rt2 = rt1.clone();

            print('尝试调用 composer.copyPass.render()...');
            composer.copyPass.render(renderer, rt1, rt2, 0.016, false);
            print('✅ copyPass.render() 执行成功，未崩溃', 'ok');

            // 如果上面成功，再添加一个 RenderPass 并完整渲染一帧
            const renderPass = new RenderPass(scene, camera);
            composer.addPass(renderPass);
            composer.renderPass = renderPass; // 确保有 renderPass 引用
            print('✅ RenderPass 已添加，准备完整渲染...');

            composer.render();
            print('✅ composer.render() 执行成功！', 'ok');

            renderer.dispose();
            rt1.dispose();
            rt2.dispose();
            print('\n🎉 EffectComposer.copyPass 及完整渲染均正常', 'ok');
        } catch (err) {
            print('❌ 错误: ' + err.message, 'fail');
            console.error(err);
        }
    </script>
</body>
</html>
