<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>FullScreenQuad 独立测试</title>
</head>
<body>
    <pre id="log"></pre>

    <script type="importmap">
    {
        "imports": {
            "three": "./001.js",
            "three/addons/postprocessing/FullScreenQuad.js": "./postprocessing/FullScreenQuad.js"
        }
    }
    </script>

    <script type="module">
        const log = document.getElementById('log');
        const print = (msg, color = 'white') => {
            log.innerHTML += `<span style="color:${color}">${msg}</span>\n`;
        };

        print('🔍 测试 FullScreenQuad 导出\n');

        try {
            const module = await import('three/addons/postprocessing/FullScreenQuad.js');
            print('✅ 模块加载成功');
            print('导出: ' + Object.keys(module).join(', '));

            if (module.FullScreenQuad) {
                print('✅ FullScreenQuad 可用', 'lime');
            } else {
                print('❌ FullScreenQuad 不存在', 'red');
            }

            if (module.Pass) {
                print('✅ Pass 可用', 'lime');
            }
        } catch (err) {
            print('❌ 错误: ' + err.message, 'red');
            console.error(err);
        }
    </script>
</body>
</html>
