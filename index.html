<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>FullScreenQuad 独立测试</title>
    <style>
        body { margin: 20px; background: #111; color: #fff; font-family: monospace; }
        pre { background: #222; padding: 15px; border-radius: 5px; }
        .ok { color: #2ecc71; }
        .fail { color: #e74c3c; }
    </style>
</head>
<body>
    <h2>FullScreenQuad 诊断</h2>
    <pre id="log"></pre>

    <script type="importmap">
    {
        "imports": {
            "three": "./001.js",
            "three/addons/postprocessing/FullScreenQuad.js": "./postprocessing/FullScreenQuad.js"
        }
    }
    </script>

    <script type="module">
        const log = document.getElementById('log');
        const print = (msg, color = 'white') => {
            log.innerHTML += `<span style="color:${color}">${msg}</span>\n`;
        };

        try {
            const THREE = await import('three');
            print('✅ Three.js 加载成功', 'ok');

            const fsq = await import('three/addons/postprocessing/FullScreenQuad.js');
            print('模块导出: ' + Object.keys(fsq).join(', '));

            const { FullScreenQuad } = fsq;
            if (!FullScreenQuad) throw new Error('FullScreenQuad 未导出');

            // 创建一个简单的材质
            const material = new THREE.ShaderMaterial({
                uniforms: {},
                vertexShader: 'void main() { gl_Position = vec4(position, 1.0); }',
                fragmentShader: 'void main() { gl_FragColor = vec4(1.0,0.0,0.0,1.0); }'
            });

            print('正在创建 FullScreenQuad 实例...');
            const quad = new FullScreenQuad(material);
            print('✅ 实例创建成功', 'ok');

            // 检查内部 _scene 是否已初始化
            if (!quad._scene) {
                throw new Error('quad._scene 未定义！请检查构造函数是否包含 this._scene = new Scene()');
            }
            print('quad._scene 存在: ' + (quad._scene instanceof THREE.Scene), 'ok');
            print('✅ FullScreenQuad 内部结构正确', 'ok');

        } catch (err) {
            print('❌ 错误: ' + err.message, 'fail');
            console.error(err);
        }
    </script>
</body>
</html>
