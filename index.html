<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试 three-mesh-bvh (002.js)</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            pointer-events: none;
            z-index: 10;
            max-width: 90%;
        }
    </style>
</head>
<body>
    <div id="info">正在加载 Three.js + three-mesh-bvh...</div>

    <script type="importmap">
    {
        "imports": {
            "three": "./001.js",
            "three-mesh-bvh": "./002.js"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        // 全部导入，避免命名导出失败
        import * as BVH from 'three-mesh-bvh';

        const infoDiv = document.getElementById('info');

        try {
            infoDiv.innerHTML = `Three.js 版本: ${THREE.REVISION}<br>正在检查 BVH 模块...`;

            // 打印全部导出，便于诊断
            console.log('BVH 模块完整导出:', BVH);

            // 尝试提取 MeshBVH（兼容命名导出和默认导出）
            let MeshBVH = BVH.MeshBVH;
            if (!MeshBVH && BVH.default) {
                // 可能是默认导出内含 MeshBVH
                MeshBVH = BVH.default.MeshBVH || BVH.default;
            }
            if (!MeshBVH) {
                throw new Error('无法找到 MeshBVH，请查看控制台 BVH 对象');
            }

            // 检查 MeshBVH.build 方法是否存在
            if (typeof MeshBVH.build !== 'function') {
                // 如果 build 方法不存在，尝试使用 computeBoundsTree 方式
                if (typeof MeshBVH.computeBoundsTree === 'function') {
                    // 给 geometry 添加方法
                    const computeBoundsTree = MeshBVH.computeBoundsTree;
                    // 测试：创建一个几何体
                    const testGeo = new THREE.TorusKnotGeometry(1, 0.3, 100, 16);
                    testGeo.computeBoundsTree = computeBoundsTree;
                    testGeo.computeBoundsTree();
                    if (testGeo.boundsTree) {
                        MeshBVH._buildMethod = 'computeBoundsTree'; // 标记
                    } else {
                        throw new Error('computeBoundsTree 执行后未生成 boundsTree');
                    }
                } else {
                    throw new Error('MeshBVH 没有 build 或 computeBoundsTree 方法');
                }
            }

            // 场景初始化
            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x111122);
            const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(3, 2, 5);
            camera.lookAt(0, 0, 0);
            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            const geometry = new THREE.TorusKnotGeometry(1, 0.3, 100, 16);
            const material = new THREE.MeshStandardMaterial({ color: 0x4cc9f0, roughness: 0.4 });
            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.set(0, 0.5, 0);
            scene.add(mesh);

            // 根据之前的检测调用适当的方法
            if (MeshBVH._buildMethod === 'computeBoundsTree') {
                geometry.computeBoundsTree();
            } else {
                MeshBVH.build(geometry);
            }

            if (!geometry.boundsTree) {
                throw new Error('BVH 构建后未生成 boundsTree');
            }

            // 光照与地面
            scene.add(new THREE.AmbientLight(0x404040, 0.6));
            const dirLight = new THREE.DirectionalLight(0xffffff, 1);
            dirLight.position.set(1, 2, 1);
            scene.add(dirLight);
            scene.add(new THREE.GridHelper(4, 20, 0x888888, 0x444444));

            function animate() {
                requestAnimationFrame(animate);
                mesh.rotation.y += 0.005;
                renderer.render(scene, camera);
            }
            animate();

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            infoDiv.innerHTML = `Three.js 版本: ${THREE.REVISION}<br>✅ MeshBVH 加载成功，BVH 已构建`;
            console.log('✅ 测试通过');

        } catch (error) {
            infoDiv.innerHTML = `❌ 测试失败:<br>${error.message}`;
            infoDiv.style.background = 'rgba(200,0,0,0.8)';
            console.error('❌ 失败:', error);
        }
    </script>
</body>
</html>
